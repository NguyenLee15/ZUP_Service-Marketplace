services:
  - type: web
    name: service-marketplace-prod-free
    runtime: node
    repo: https://gitlab.com/Nguyenlee150804/service-marketplace
    branch: main
    rootDir: Be
    region: singapore
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: RUNTIME_PROFILE
        value: free
      - key: REDIS_ENABLED
        value: "false"
      - key: QUEUE_MODE
        value: inline
      - key: WORKER_ENABLED
        value: "false"
      - key: CRON_ENABLED
        value: "false"
      - key: CORS_ALLOWED_HEADERS
        value: Content-Type,Authorization,x-request-id
      - key: CORS_CREDENTIALS
        value: "true"
      - key: THROTTLE_TTL
        value: "60000"
      - key: THROTTLE_LIMIT
        value: "100"
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: MAIL_PROVIDER
        value: brevo
      - key: BREVO_SENDER_NAME
        value: Service Marketplace
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: AI_TIMEOUT_MS
        value: "5000"
      - key: AI_RETRY_COUNT
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_URL
        sync: false
      - key: VNPAY_RETURN_URL
        sync: false
      - key: VNPAY_IPN_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
