services:
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: service_marketplace_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d service_marketplace_test']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
