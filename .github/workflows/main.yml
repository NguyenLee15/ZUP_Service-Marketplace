name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Be
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './Be/package-lock.json'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run lint

  backend-integration:
    name: Backend Integration CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: service_marketplace_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./Be
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/service_marketplace_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/service_marketplace_test?schema=public
      JWT_SECRET: test-secret-long-enough
      JWT_REFRESH_SECRET: test-refresh-secret-long-enough
      REDIS_ENABLED: 'false'
      QUEUE_MODE: inline
      WORKER_ENABLED: 'false'
      CRON_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './Be/package-lock.json'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:integration

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fe/wed
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './fe/wed/package-lock.json'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
